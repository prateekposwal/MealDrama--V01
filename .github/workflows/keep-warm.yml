name: Keep Render Warm

# Pings the Render free-tier health endpoint every 4 minutes so the instance
# never reaches the ~15-minute idle spin-down. GitHub Actions cron has 5-minute
# granularity (honored by */4). Runs are FREE on public repos and, when
# delayed under load, typically stay well inside the 15-minute idle window.
#
# NOTE: GitHub disables scheduled workflows after ~60 days of repo inactivity
# (no push in that window) — re-enable or push to reactivate if that happens.
# Render free instances may also be restarted by Render at any time; that is
# acceptable for this app (cold start ~1 min).

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/4 * * * *'

jobs:
  ping:
    name: Ping Render health
    runs-on: ubuntu-latest
    steps:
      # Render free-tier instances cold-boot in ~30-60s after idle. A single
      # curl with --max-time 20 fails against a cold instance, and because the
      # cron fires every ~5 min the instance then NEVER warms: every ping fails
      # and the service stays asleep (we saw 3+ consecutive workflow failures).
      # Loop instead: try every 10s for up to ~2.5 min so a cold boot completes;
      # a warm instance answers on attempt 1 (<2s). Failing the job (exit 1)
      # still shows in the Actions UI, but a sleeping Render now gets woken.
      - name: Ping Render health (retry across cold-boot window)
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null --max-time 10 https://mealdrama.onrender.com/health; then
              echo "health ok (attempt $i)"
              exit 0
            fi
            echo "health not ready (attempt $i of 15) — retrying"
            sleep 10
          done
          echo "health check failed after 15 attempts" >&2
          exit 1
