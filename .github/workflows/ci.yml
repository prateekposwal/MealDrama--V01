name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.mealdrama.example.com/api/v1' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
        # HARD GATE since 2026-09-14: the test/scratch backlog was cleaned to
        # zero; continue-on-error would have let stale-JWT/UPS regressions ship.

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: E2E (browser)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Prisma client + schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Install Playwright chromium
        run: npx playwright-core install --with-deps chromium
      # API + app + browser suite run in ONE step: GH Actions kills background
      # processes at step boundaries, so a separately-started API server would
      # die before the suite runs. The runner (`npm run test:e2e`) builds the
      # app and serves it on :5176 itself; the API is started here and waits
      # for /healthz before the suite begins.
      - name: Start API and run E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          NODE_ENV: test
        run: |
          cd server && nohup npx ts-node --transpile-only src/index.ts > /tmp/api.log 2>&1 &
          cd ..
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:3001/healthz || { echo 'API failed to boot:'; cat /tmp/api.log; exit 1; }
          npm run test:e2e
